# ==============================================================================
# SRE Agent Workshop · Example Configuration Template (config.example.yaml)
# ==============================================================================
# Copy this file to config.yaml:
#   cp config.example.yaml config.yaml
#
# Set your API key via environment variable:
#   export OPENAI_API_KEY="sk-..."
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MODEL SELECTION (Module 2: Small vs Frontier Models)
# ------------------------------------------------------------------------------
# Available Workshop Models:
#   - "gemini-3.8-flash"                       # High-end frontier reasoning model
#   - "qwen/qwen3-235b-a22b-instruct-2507-maas" # High-end open model (235B parameters)
#   - "NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"    # Small model (30B parameters)
#   - "mock"                                   # Offline deterministic simulation
model: "gemini-3.8-flash"

# Gateway credentials:
api_base: "https://llm-gateway.dev.nudgebee.pollux.in/v1"
api_key: ""

# ------------------------------------------------------------------------------
# 2. ACTIVE TOOLS (Module 3 & 6: Tool Accuracy & Tool Ceilings)
# Comment out any tool to observe how the agent behaves under tool deprivation!
# ------------------------------------------------------------------------------
enabled_tools:
  - query_prometheus         # Instant PromQL queries for error rates, latency percentiles, and memory soak
  - get_k8s_events           # Inspects pod restarts, crashloops, and OOMKills
  - query_pod_logs           # Fetches and filters recent container stdout/stderr
  - inspect_topology         # 1-hop microservice dependency lookup (Module 5)
  - ask_human_approval       # Human-in-the-loop security gate before mutating remediation (Module 7)
  - get_deploy_history       # Rollout history, commit hashes, author & config diffs (Session 1 & 2C)
  - search_incident_history   # Episodic memory store of past post-mortems and prior fixes (Session 2A)

# ------------------------------------------------------------------------------
# 3. TARGET ENVIRONMENT & SCENARIO
# ------------------------------------------------------------------------------
namespace: "group-1"

# Available Scenarios:
#   - "badDeploy1405"        # Checkout latency spike after 14:05 timeout deploy
#   - "episodicRecurrence"   # Connection pool starvation matching INC-4092
#   - "postgresFailure"      # Database pool starvation / unreachable (gRPC 13 INTERNAL)
#   - "emailMemoryLeak"      # Unbounded heap buffer growth leading to OOMKill Exit Code 137
#   - "postgresSlow"         # Injected database query sleep (p99 latency without 500s)
#   - "poisonedEntity"       # Red-team hallucination & abstention testing
scenario: "badDeploy1405"

# ------------------------------------------------------------------------------
# 4. EPISODIC MEMORY (Session 2A: Memory ON vs Memory OFF)
# ------------------------------------------------------------------------------
enable_memory_recall: false
persist_verified_resolution: true

# ------------------------------------------------------------------------------
# 5. CONTEXT MODE & PROMPT CACHING (Module 4 & 8)
# ------------------------------------------------------------------------------
context_mode: "filtered_regex"
enable_prompt_caching: true

# ------------------------------------------------------------------------------
# 6. INVESTIGATION LIMITS
# ------------------------------------------------------------------------------
# Max agent reasoning steps before a forced final synthesis turn.
# Override per-run without editing this file:
#   python3 mini_agent.py --max-turns 15     # complex multi-hop incident
#   python3 mini_agent.py --max-turns 4      # cheap smoke run
max_turns: 10
